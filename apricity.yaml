name: Apricity Tests Pipeline
actions:
  test:
    jobs:
      - quality:
          runs-on: ruby:3.4
          name: Check Apricity Code Quality
          mounts:
            - source: .
              target: /work
              type: bind
          steps:
            - name: Bundle install
              run: |
                bundle config set --local path 'vendor/bundle'
                bundle install

            # - name: Cache gems
            #   uses: apricity/cache
            #   with:
            #     key: bundler-${{ hashfiles('Gemfile.lock') }}

            - name: Run code quality tools
              run: |
                bundle exec reek lib
      - lint:
          runs-on: ruby:3.4
          name: Lint Apricity Codebase
          mounts:
            - source: .
              target: /work
              type: bind
          steps:
            - name: Bundle install
              run: |
                bundle config set --local path 'vendor/bundle'
                bundle install
            - name: Run linters
              run: |
                bundle exec rubocop lib

            # - name: Cache gems
            #   uses: apricity/cache
            #   with:
            #     key: bundler-${{ hashfiles('Gemfile.lock') }}

      - test:
          runs-on: ruby:3.4
          name: Build and Test Apricity
          needs: [lint, quality]
          outputs:
            - key: test-outputs
              type: artifact
          plugins:
            - uses: apricity/junit-reporter
              with:
                junit_report: rspec.xml
                artifact_key: test-outputs
          mounts:
            - source: .
              target: /work
              type: bind 
            # Use DinD to allow apricity to test itself
            - source: /var/run/docker.sock
              target: /var/run/docker.sock
              type: bind
          steps:
            - name: Bundle install
              run: |
                bundle config set --local path 'vendor/bundle'
                bundle install

            # - name: Cache gems
            #   uses: apricity/cache
            #   with:
            #     key: bundler-${{ hashfiles('Gemfile.lock') }}
            #     path: vendor/bundle

            - name: Run tests
              run: |
                bundle exec rspec \
                  --fail-fast \
                  --format progress \
                  --format RspecJunitFormatter \
                  --out artifacts/test-outputs/rspec.xml
