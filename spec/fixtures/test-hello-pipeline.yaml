name: Hello World Pipeline
actions:
  test:
    jobs:
      - test:
          runs-on: ruby:3.4
          name: Hello World Test Job
          mounts:
            - source: .
              target: /work/app
              type: bind
            # Use DinD to allow apricity to test itself via apricot
            - source: /var/run/docker.sock
              target: /var/run/docker.sock
              type: bind
          plugins:
            - uses: apricity/junit-reporter
              with:
                junit_report: rspec.xml
                artifact_key: test-output
            - uses: apricity/simplecov-reporter
              with:
                coverage_report: .resultset.json
                artifact_key: coverage
          outputs:
            - key: test-output
              type: artifact
              # we could use some id for plugin to refer to? kind of working 'by accident' now
          steps:
            - name: Bundle install
              run: |
                bundle config set --local path 'vendor/bundle'
                bundle install

            - name: Run simple test
              run: |
                bundle exec rspec \
                  --fail-fast \
                  --format progress \
                  --format RspecJunitFormatter \
                  --out $APRICITY_ARTIFACTS/artifacts/test-output/rspec.xml \
                  spec/greeter_spec.rb
