name: Vets API Test
actions:
  test:
    jobs:
      - test:
          runs-on: ruby:3.3
          name: Test Vets API
          services:
            postgres:
              image: postgis/postgis:14-3.3-alpine
              env:
                POSTGRES_USER: postgres
                POSTGRES_PASSWORD: password
            redis:
              image: redis:7
          env:
            CI: "true"
            RAILS_ENV: test
            DISABLE_BOOTSNAP: "true"
            NOCOVERAGE: "true"
            SETTINGS__DATABASE_URL: "postgis://postgres:password@postgres:5432/vets_api_development?pool=4"
            SETTINGS__TEST_DATABASE_URL: "postgis://postgres:password@postgres:5432/vets_api_test"
            SETTINGS__REDIS__APP_DATA__URL: "redis://redis:6379"
            SETTINGS__REDIS__SIDEKIQ__URL: "redis://redis:6379"
            BUNDLE_ENTERPRISE__CONTRIBSYS__COM: <%= ENV['BUNDLE_ENTERPRISE__CONTRIBSYS__COM'] %>
          plugins:
            - uses: apricity/junit-reporter
              with:
                junit_report: rspec.xml
                artifact_key: junit
          outputs:
            - key: junit
              type: artifact
          steps:
            - name: Checkout Vets API
              uses: apricity/checkout@v0
              with:
                repository: https://github.com/department-of-veterans-affairs/vets-api
                ref: master

            - name: Load Bundled Gems from Cache
              uses: apricity/cache@v0
              with:
                key: vets-api-bundler-ruby-3.3
                checksum_file: Gemfile.lock
                perform_restore: true
                paths:
                  - vendor/bundle

            - name: Install deps
              run: |
                apt-get update
                apt-get install -y postgresql-client pdftk poppler-utils imagemagick ghostscript tesseract-ocr
                apt-get install -y --no-install-recommends \
                  build-essential pkg-config \
                  git curl ca-certificates \
                  libffi-dev libyaml-dev zlib1g-dev libgmp-dev

            - name: Wait for postgres
              run: |
                until pg_isready -h postgres -p 5432; do
                  echo "Waiting for postgres..."
                  sleep 1
                done

            - name: Bundle install
              run: |
                bundle config set --local path vendor/bundle
                bundle config set --local without development
                bundle config set --local deployment true
                bundle config set --local clean true

                bundle install --jobs 4 --retry 3

            # - name: Package gems for caching
            #   run: |
            #     bundle package --all --no-prune --path vendor/cache

            - name: Cache Bundled Gems
              uses: apricity/cache@v0
              with:
                key: vets-api-bundler-ruby-3.3
                checksum_file: Gemfile.lock
                perform_save: true
                paths:
                  - vendor/bundle

            - name: Prepare Test Database
              run: |
                bundle exec rails db:test:prepare

            - name: Run user spec
              run: |
                bundle exec rspec --fail-fast spec/models spec/lib \
                  --format progress \
                  --format RspecJunitFormatter \
                  --out $APRICITY_ARTIFACTS/junit/rspec.xml
      
            - name: Run Linter
              run: |
                bundle exec rubocop app lib