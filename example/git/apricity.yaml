name: Git Checkout Action Test
actions:
  test:
    jobs:
      - test:
          runs-on: ruby:3.4
          name: Test Apricity from Git Checkout
          plugins:
            - uses: apricity/junit-reporter
              with:
                junit_report: rspec.xml
                artifact_key: test-results
            - uses: apricity/simplecov-reporter
              with:
                coverage_report: .resultset.json
                artifact_key: coverage
          mounts:
            # Use DinD to allow apricity to test itself
            - source: /var/run/docker.sock
              target: /var/run/docker.sock
              type: bind
          steps:
            - name: Checkout Apricity Code
              uses: apricity/checkout@v0
              with:
                repository: https://github.com/jweissman/apricity
                ref: main

            - name: Bundle install
              run: |
                bundle config set --local path 'vendor/bundle'
                bundle install

            - name: Run tests
              run: |
                bundle exec rspec \
                  --tag ~dind \
                  --fail-fast \
                  --format progress \
                  --format RspecJunitFormatter \
                  --out $APRICITY_ARTIFACTS/test-results/rspec.xml
