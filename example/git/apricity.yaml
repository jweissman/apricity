name: Git Checkout Action Test
actions:
  test:
    jobs:
      - test:
          runs-on: ruby:3.4
          name: Test Apricity from Git Checkout
          plugins:
            - uses: apricity/junit-reporter
              with:
                junit_report: rspec.xml
                artifact_key: test-results
          # outputs:
          #   - key: test-outputs
          #     type: artifact
          mounts:
            # Use DinD to allow apricity to test itself
            - source: /var/run/docker.sock
              target: /var/run/docker.sock
              type: bind
          steps:
            - name: Introspect
              run: |
                pwd
                ls -la
            - name: Checkout Apricity Code
              uses: apricity/checkout@v0
              with:
                # github_repo: jweissman/apricity
                repository: "https://github.com/jweissman/apricity"
                ref: main

            - name: Bundle install
              run: |
                bundle config set --local path 'vendor/bundle'
                bundle install

            - name: Run tests
              run: |
                bundle exec rspec \
                  --fail-fast \
                  --format progress \
                  --format RspecJunitFormatter \
                  --out $APRICITY_ARTIFACTS/test-outputs/rspec.xml
