name: Vets API SBOM
actions:
  test:
    jobs:
      - sbom:
          runs-on: ruby:3.4
          name: Generate SBOM for Vets API
          plugins:
            - uses: apricity/sbom-reporter
              with:
                output_file: sbom.json
                artifact_key: sbom
          steps:
            - name: Checkout Vets API
              uses: apricity/checkout@v0
              with:
                repository: https://github.com/department-of-veterans-affairs/vets-api
                ref: master
            - name: Install Cyclone DX Ruby Gem
              run: |
                gem install cyclonedx-ruby
            - name: Generate SBOM for Vets API
              run: |
                export PATH="$(ruby -e 'print Gem.bindir'):$PATH"

                cyclonedx-ruby -o $APRICITY_ARTIFACTS/sbom/sbom.xml -p .
          outputs:
            - key: sbom
              type: artifact
      - test:
          runs-on: ruby:3.4
          name: Test Vets API
          steps:
            - name: Checkout Vets API
              uses: apricity/checkout@v0
              with:
                repository: https://github.com/department-of-veterans-affairs/vets-api
                ref: master
            - name: Load Bundled Gems from Cache
              uses: apricity/cache-restore@v0
              with:
                key: bundler-ruby-3.4
                checksum_file: Gemfile.lock
                paths:
                  - vendor/bundle
            - name: Bundle install
              run: |
                bundle config set --local path 'vendor/bundle'
                bundle install
            - name: Cache Bundled Gems
              uses: apricity/cache-save@v0
              with:
                key: bundler-ruby-3.4
                checksum_file: Gemfile.lock
                paths:
                  - vendor/bundle
