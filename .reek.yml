---
exclude_paths:
  - vendor
  - "**/vendor"

detectors:
  DuplicateMethodCall:
    enabled: false
  LongParameterList:
    enabled: false
  UncommunicativeVariableName:
    enabled: false
  TooManyStatements:
    enabled: false
  TooManyMethods:
    enabled: false
  FeatureEnvy:
    enabled: false
  NestedIterators:
    enabled: false
  UtilityFunction:
    enabled: false
  IrresponsibleModule:
    enabled: false
  DataClump:
    enabled: false
  ControlParameter:
    enabled: false
  TooManyInstanceVariables:
    enabled: false
  InstanceVariableAssumption:
    enabled: false
  RepeatedConditional:
    enabled: false
  ManualDispatch:
    enabled: false